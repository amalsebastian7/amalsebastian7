name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs automatically at 12 AM UTC every day
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: Update WakaTime Stat
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
